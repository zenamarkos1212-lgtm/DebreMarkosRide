name: Build Debre Markos Ride APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project if missing
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create --project-name debremarkosride --org com.debremarkos.ride .
          fi

      - name: Configure map and location dependencies
        run: |
          flutter pub add flutter_map
          flutter pub add latlong2
          flutter pub add geolocator

      - name: Configure Android location permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i\\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"

      - name: Build Android APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DebreMarkosRide-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
